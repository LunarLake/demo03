# =============================================================
# Mosquitto 配置 —— demo03 智慧研讨室门禁通道
# =============================================================
# 用法（Docker，推荐）：
#   docker run -d --name mosquitto \
#     -p 1883:1883 \
#     -v "$PWD/deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
#     -v "$PWD/deploy/mosquitto/acl:/mosquitto/config/acl:ro" \
#     -v "$PWD/deploy/mosquitto/passwd:/mosquitto/config/passwd:ro" \
#     eclipse-mosquitto:2
#
# 关键点：**禁止匿名**，并且每台设备只允许读写自己主题下的一切。
# 如果允许匿名，任何人都能往 room/+/cmd 发开锁指令；如果给设备 # 通配，
# 一台设备被攻破就等于整个楼层的门都开了。
# =============================================================

listener 1883 0.0.0.0
protocol mqtt

# 关闭匿名：密码文件里没有的账号一律拒绝
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# 服务端重发窗口：QoS1 下未确认的消息会重投，设备端靠 msgId 去重
max_inflight_messages 20
max_queued_messages 100

# 不做持久化会话：设备掉电重启后重新订阅，避免堆积的历史消息被补发
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
