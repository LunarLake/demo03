# =============================================================
# Mosquitto 配置 —— Windows 原生版（无 Docker 时使用）
# =============================================================
# 用法：在**项目根目录**下执行
#   "C:/Program Files/mosquitto/mosquitto.exe" -c deploy/mosquitto/mosquitto-windows.conf -v
#
# 与 mosquitto.conf（Docker 版）的差异只有两处：
#   1. 密码文件/ACL 用相对项目根目录的路径，不再是容器内的 /mosquitto/config/
#   2. 不带 log_dest 之外的容器专用项，其余安全设置逐条对齐
#
# 为什么必须从项目根目录启动：下面两个路径是相对路径，相对的是进程工作目录。
# 用系统服务方式跑（CWD 是 System32）会找不到文件，服务直接起不来。
#
# ★ 安装包默认会注册一个名为 mosquitto 的 Windows 服务并自动启动，
#   它用 C:\Program Files\mosquitto\mosquitto.conf（全默认、允许匿名）占着 1883。
#   启动本配置前必须先让开端口，否则报 "Address in use"：
#     net stop mosquitto && sc config mosquitto start= disabled    （需管理员）
# =============================================================

# 绑 0.0.0.0 是为了让 ESP8266 从局域网连进来；
# 首次启动 Windows 会弹防火墙授权框，必须选"允许"（专用网络即可）。
listener 1883 0.0.0.0
protocol mqtt

# 关闭匿名：密码文件里没有的账号一律拒绝
allow_anonymous false
password_file deploy/mosquitto/passwd
acl_file deploy/mosquitto/acl

# 服务端重发窗口：QoS1 下未确认的消息会重投，设备端靠 msgId 去重
max_inflight_messages 20
max_queued_messages 100

# 不做持久化会话：设备掉电重启后重新订阅，避免堆积的历史消息被补发
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
