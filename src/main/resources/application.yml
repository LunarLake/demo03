spring:
  application:
    name: demo03
  # 默认启用 local 配置；生产可设 SPRING_PROFILES_ACTIVE=prod 等
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db02}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    # 密码优先来自环境变量 DB_PASSWORD，或由 application-local.yml 覆盖（该文件已加入 .gitignore）
    password: ${DB_PASSWORD:}

# 会话 Cookie SameSite=Lax：跨站 POST 不带 Cookie，与 CSRF Token 双重防护
server:
  servlet:
    session:
      cookie:
        same-site: lax
