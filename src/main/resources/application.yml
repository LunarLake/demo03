spring:
  application:
    name: demo03
  # 默认启用 local 配置；生产可设 SPRING_PROFILES_ACTIVE=prod 等
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db02}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    # 密码优先来自环境变量 DB_PASSWORD，或由 application-local.yml 覆盖（该文件已加入 .gitignore）
    password: ${DB_PASSWORD:}

# 会话 Cookie SameSite=Lax：跨站 POST 不带 Cookie，与 CSRF Token 双重防护
server:
  servlet:
    session:
      cookie:
        same-site: lax

# =============================================================
# 业务参数（docs/重构改造计划.md 3.2.1 / 3.2.3 / 3.2.4）
# 键名与 SlotProperties 的字段一一对应；现场演示可直接改这里再重启。
# =============================================================
app:
  slot:
    open-hour: 8
    open-minute: 0
    close-hour: 22
    close-minute: 0
    # 单元长度：文档要求 15 分钟
    unit-minutes: 15
    # 单次时长 15 分钟 ~ 4 小时 = 1 ~ 16 个单元
    min-units: 1
    max-units: 16
    max-advance-days: 7
    # 首次签到窗口：[开始, 开始+5min)
    checkin-window-minutes: 5
    # 结束前提醒
    remind-before-minutes: 5

  # 开放注册：一期只保留 5 个虚构账号，默认关闭（见计划 Q4）
  registration:
    enabled: false

  # MQTT 门禁通道
  #   mode=inprocess：进程内总线，不需要 Broker，模拟器与后端在同一进程内互通（默认）
  #   mode=paho     ：连真实 Mosquitto（需先启动 Broker）
  mqtt:
    mode: ${MQTT_MODE:inprocess}
    broker-url: ${MQTT_BROKER_URL:tcp://127.0.0.1:1883}
    client-id: ${MQTT_CLIENT_ID:demo03-backend}
    username: ${MQTT_USERNAME:backend}
    password: ${MQTT_PASSWORD:}
    qos: 1
    # 心跳超时判定：设备 30 秒一次，超过 90 秒判离线
    heartbeat-timeout-seconds: 90

  # 设备模拟器：硬件未到货期间顶替 STM32，同样走 MQTT 与 HMAC 校验
  simulator:
    enabled: ${SIMULATOR_ENABLED:false}
    device-code: ROOM-A-01
    secret: demo-secret-room-a-please-change
    # 故障注入：0 = 正常，0.2 = 随机丢回执，用于验证"签到成功但开锁失败不回滚"
    fail-rate: 0.0
    # 屏幕输出目录，答辩时可截图
    screen-dir: target/simulator

  # 门禁通道：log = 仅记录不真开锁（默认，硬件未到货）；mqtt = 走 Mosquitto 下发
  door:
    mode: ${DOOR_MODE:log}
    # 一次性指令有效期：过期后设备必须丢弃，服务端置 EXPIRED
    ttl-seconds: 30
