<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block
      th:replace="~{fragments/common-head :: head('审批管理')}"
    ></th:block>
  </head>
  <body class="d-flex">
    <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>
    <main class="content-area flex-grow-1">
      <th:block
        th:replace="~{fragments/header :: header('审批管理')}"
      ></th:block>
      <section class="container-fluid py-4 px-3 px-md-4">
        <div
          th:if="${info != null}"
          class="alert alert-dismissible fade show"
          th:classappend="${infoType == 'success' ? 'alert-success' : (infoType == 'danger' ? 'alert-danger' : 'alert-info')}"
          role="alert"
        >
          <span th:text="${info}"></span>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
          ></button>
        </div>
        <div
          th:if="${overdue != null and overdue > 0}"
          class="alert alert-warning"
          role="alert"
        >
          有 <b th:text="${overdue}"></b> 笔申请已超过
          <b th:text="${dueHours}"></b> 小时未处理，请尽快办结。
        </div>
        <div class="card summary-card">
          <div class="card-header bg-white border-0">
            <h2 class="h5 mb-0">待审批预约</h2>
          </div>
          <div class="card-body">
            <table
              class="table table-hover"
              th:if="${!#lists.isEmpty(approvals)}"
            >
              <thead>
                <tr>
                  <th>申请人</th>
                  <th>会议室</th>
                  <th>人数/容量</th>
                  <th>开始时间</th>
                  <th>结束时间</th>
                  <th>为什么进人工</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="a : ${approvals}">
                  <td>
                    <a
                      th:href="@{/reservation/detail/{id}(id=${a.id})}"
                      th:text="${a.userName}"
                    ></a>
                  </td>
                  <td th:text="${a.roomName}"></td>
                  <td>
                    <span
                      th:text="${a['attendee_count'] != null ? a['attendee_count'] : '-'}"
                    ></span>
                    /
                    <span th:text="${a.capacity}"></span>
                    <span
                      th:if="${a['attendee_count'] != null and a.capacity != null and a['attendee_count'] > a.capacity}"
                      class="badge bg-danger ms-1"
                      >超员</span
                    >
                  </td>
                  <td
                    th:text="${#strings.substring(a['start_time'].toString(), 0, 16)}"
                  ></td>
                  <td
                    th:text="${#strings.substring(a['end_time'].toString(), 0, 16)}"
                  ></td>
                  <td class="small">
                    <!-- 管理员要能直接看到"这笔为什么没被自动通过"，而不是去猜 -->
                    <span
                      class="badge bg-secondary"
                      th:text="${a['hit_rule_codes'] != null ? a['hit_rule_codes'] : a['decision_path']}"
                      >E01_HEADCOUNT</span
                    >
                    <div
                      class="text-muted mt-1"
                      th:if="${a['attendee_count'] != null and a.capacity != null and a['attendee_count'] >= 5}"
                    >
                      人数达阈值的申请一律转人工
                    </div>
                  </td>
                  <td>
                    <div class="d-flex gap-2">
                      <button
                        type="button"
                        class="btn btn-sm btn-success"
                        data-bs-toggle="modal"
                        data-bs-target="#approveModal"
                        th:attr="data-id=${a.id},data-user=${a.userName},data-room=${a.roomName}"
                      >
                        批准
                      </button>
                      <button
                        type="button"
                        class="btn btn-sm btn-danger"
                        data-bs-toggle="modal"
                        data-bs-target="#rejectModal"
                        th:attr="data-id=${a.id},data-user=${a.userName},data-room=${a.roomName}"
                      >
                        拒绝
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
            <p
              th:if="${#lists.isEmpty(approvals)}"
              class="text-center text-muted py-4"
            >
              暂无待审批预约
            </p>
          </div>
        </div>
      </section>
    </main>
    <th:block th:replace="~{fragments/common-scripts :: scripts}"></th:block>

    <!-- 批准确认弹窗 -->
    <div class="modal fade" id="approveModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form th:action="@{/reservation/approve}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf}" />
            <input type="hidden" name="id" id="approveId" />
            <div class="modal-header">
              <h5 class="modal-title">确认批准</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <p>
                确认批准 <strong id="approveUser"></strong> 对
                <strong id="approveRoom"></strong> 的预约申请？
              </p>
              <p class="text-muted small mb-0">
                <span th:if="${codeVisibleOnWeb}">批准后生成 4 位签到码（当前为模拟门禁，申请人可在“我的预约”查看）。</span><span th:unless="${codeVisibleOnWeb}">批准后生成 4 位签到码，仅在门禁屏幕显示。</span> 预约开始后 <b th:text="${checkinWindowMinutes}">5</b> 分钟内未签到将释放并记爽约。
              </p>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                取消
              </button>
              <button type="submit" class="btn btn-success">确认批准</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- 拒绝弹窗（可选原因） -->
    <div class="modal fade" id="rejectModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form th:action="@{/reservation/reject}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf}" />
            <input type="hidden" name="id" id="rejectId" />
            <div class="modal-header">
              <h5 class="modal-title">确认拒绝</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <p>
                确认拒绝 <strong id="rejectUser"></strong> 对
                <strong id="rejectRoom"></strong> 的预约申请？
              </p>
              <div class="mb-3">
                <label for="rejectReason" class="form-label"
                  >拒绝原因（选填，将展示给申请人）</label
                >
                <textarea
                  class="form-control"
                  id="rejectReason"
                  name="reason"
                  maxlength="200"
                  aria-describedby="rejectReasonHint"
                  rows="3"
                  placeholder="如：该时段已有教学安排"
                ></textarea>
                <div id="rejectReasonHint" class="form-text">最多200字，空白时使用默认原因。</div>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                取消
              </button>
              <button type="submit" class="btn btn-danger">确认拒绝</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      // 打开弹窗时把对应行数据填入隐藏字段与文案
      document
        .getElementById("approveModal")
        .addEventListener("show.bs.modal", function (event) {
          const btn = event.relatedTarget;
          document.getElementById("approveId").value =
            btn.getAttribute("data-id");
          document.getElementById("approveUser").textContent =
            btn.getAttribute("data-user");
          document.getElementById("approveRoom").textContent =
            btn.getAttribute("data-room");
        });
      document
        .getElementById("rejectModal")
        .addEventListener("show.bs.modal", function (event) {
          const btn = event.relatedTarget;
          document.getElementById("rejectId").value =
            btn.getAttribute("data-id");
          document.getElementById("rejectUser").textContent =
            btn.getAttribute("data-user");
          document.getElementById("rejectRoom").textContent =
            btn.getAttribute("data-room");
          document.getElementById("rejectReason").value = "";
        });
    </script>
  </body>
</html>
