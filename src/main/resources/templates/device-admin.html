<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/common-head :: head('设备管理')}"></th:block>
  </head>
  <body class="d-flex">
    <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>
    <main class="content-area flex-grow-1">
      <th:block th:replace="~{fragments/header :: header('设备管理')}"></th:block>
      <section class="container-fluid py-4 px-3 px-md-4">
        <div
          th:if="${info != null}"
          class="alert alert-dismissible fade show"
          th:classappend="'alert-' + ${infoType != null ? infoType : 'info'}"
          role="alert"
        >
          <span th:text="${info}"></span>
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="alert alert-light border small">
          <b>当前门禁通道：</b><code th:text="${channel}">log</code>
          <span th:if="${channel == 'log'}" class="text-muted">
            —— 这是"只记录不执行"的模拟实现，测试开锁不会真的动门锁。
            想验证协议全链路，用 <code>--spring.profiles.active=local,mqtt-demo</code> 启动。
          </span>
          <br />
          在线状态由心跳决定（30 秒一次，90 秒未心跳判离线），不能手工改。
        </div>

        <div class="row g-3">
          <div class="col-12 col-xl-6" th:each="d : ${devices}">
            <div class="card summary-card h-100">
              <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
                <div>
                  <span class="fw-semibold" th:text="${d['deviceCode']}">ROOM-A-01</span>
                  <span class="text-muted small ms-2" th:text="${d['roomName']}">研讨室A</span>
                </div>
                <span th:if="${d['online'] == 1}" class="badge bg-success">在线</span>
                <span th:unless="${d['online'] == 1}" class="badge bg-secondary">离线</span>
              </div>
              <div class="card-body">
                <div class="row small mb-2">
                  <div class="col-6 text-muted">固件</div>
                  <div class="col-6" th:text="${d['firmwareVer'] != null ? d['firmwareVer'] : '—'}"></div>
                  <div class="col-6 text-muted">最后心跳</div>
                  <div
                    class="col-6"
                    th:text="${d['lastHeartbeatAt'] != null ? #temporals.format(d['lastHeartbeatAt'], 'MM-dd HH:mm:ss') : '从未上报'}"
                  ></div>
                </div>

                <div class="table-responsive">
                  <table class="table table-sm mb-2 align-middle">
                    <thead>
                      <tr>
                        <th>时间</th>
                        <th>指令</th>
                        <th>状态</th>
                        <th>回执</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="c : ${d['commands']}">
                        <td class="small text-nowrap"
                            th:text="${#temporals.format(c.issuedAt, 'MM-dd HH:mm:ss')}"></td>
                        <td class="small" th:text="${c.cmdType}"></td>
                        <td class="small">
                          <span th:if="${c.status == 'ACKED'}" class="badge bg-success">已回执</span>
                          <span th:if="${c.status == 'SENT'}" class="badge bg-info">已下发</span>
                          <span th:if="${c.status == 'PENDING'}" class="badge bg-secondary">待发</span>
                          <span th:if="${c.status == 'FAILED'}" class="badge bg-danger">失败</span>
                          <span th:if="${c.status == 'EXPIRED'}" class="badge bg-secondary">已过期</span>
                        </td>
                        <td class="small text-muted" th:text="${c.resultCode}"></td>
                      </tr>
                      <tr th:if="${#lists.isEmpty(d['commands'])}">
                        <td colspan="4" class="text-center text-muted py-3">暂无指令记录</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <form th:action="@{/admin/devices/{id}/test-unlock(id=${d['id']})}" method="post"
                      class="d-inline">
                  <input type="hidden" name="_csrf" th:value="${_csrf}" />
                  <button type="submit" class="btn btn-sm btn-outline-primary"
                          onclick="return confirm('向该设备下发一次测试开锁？');">
                    测试开锁
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <th:block th:replace="~{fragments/common-scripts :: scripts}"></th:block>
  </body>
</html>
