<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common-head :: head('预约详情')}"></th:block>
</head>
<body class="d-flex">
<th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>
<main class="content-area flex-grow-1">
    <th:block th:replace="~{fragments/header :: header('预约签到详情')}"></th:block>
    <section class="container-fluid py-4 px-3 px-md-4">
        <div class="row">
            <div class="col-lg-6">
                <div class="card summary-card mb-3">
                    <div class="card-header bg-white border-0"><h2 class="h5 mb-0">预约信息</h2></div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <tr><td class="text-muted">申请人</td><td th:text="${detail.userName}"></td></tr>
                            <tr><td class="text-muted">会议室</td><td th:text="${detail.roomName}"></td></tr>
                            <tr><td class="text-muted">参会人数</td><td th:text="${detail['attendee_count'] != null ? detail['attendee_count'] : '-'}"></td></tr>
                            <tr><td class="text-muted">开始时间</td><td th:text="${#strings.substring(detail['start_time'].toString(), 0, 16)}"></td></tr>
                            <tr><td class="text-muted">结束时间</td><td th:text="${#strings.substring(detail['end_time'].toString(), 0, 16)}"></td></tr>
                            <tr><td class="text-muted">预约状态</td><td>
                                <span th:if="${detail['reservation_status'] == 0}" class="badge bg-warning">待审批</span>
                                <span th:if="${detail['reservation_status'] == 1}" class="badge bg-success">已通过</span>
                                <span th:if="${detail['reservation_status'] == 2}" class="badge bg-danger">已拒绝</span>
                                <span th:if="${detail['reservation_status'] == 3}" class="badge bg-secondary"
                                      th:text="${detail['cancel_source'] == 'TEACHER_OVERRIDE'} ? '已被教师覆盖' : '已取消'">已取消</span>
                                <span th:if="${detail['reservation_status'] == 5}" class="badge bg-secondary">超时释放</span>
                                <span th:if="${detail['reservation_status'] == 6}" class="badge bg-primary">已签到</span>
                                <span th:if="${detail['reservation_status'] == 7}" class="badge bg-secondary">已结束</span>
                            </td></tr>
                            <tr th:if="${detail['decision_path'] != null}"><td class="text-muted">判定路径</td><td th:text="${detail['decision_path']}"></td></tr>
                            <tr th:if="${detail['hit_rule_codes'] != null}"><td class="text-muted">命中规则</td><td th:text="${detail['hit_rule_codes']}"></td></tr>
                            <tr th:if="${detail['decision_reason'] != null}"><td class="text-muted">处理原因</td><td th:text="${detail['decision_reason']}"></td></tr>
                            <tr th:if="${detail['checkInCode'] != null}"><td class="text-muted">签到码</td>
                                <td><span th:text="${detail['checkInCode']}"></span>
                                    <span th:if="${detail['codeRevokedAt'] != null}" class="badge bg-secondary ms-1">已失效</span>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card summary-card mb-3">
                    <div class="card-header bg-white border-0"><h2 class="h5 mb-0">签到记录</h2></div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <tr><td class="text-muted">签到状态</td><td>
                                <span th:if="${detail['attend_status'] != null and detail['attend_status'] == 1}" class="badge bg-success">已签到</span>
                                <span th:if="${detail['attend_status'] == null or detail['attend_status'] == 0}" class="badge bg-secondary">未签到</span>
                            </td></tr>
                            <tr th:if="${detail['checkInTime'] != null}"><td class="text-muted">签到时间</td><td th:text="${#strings.substring(detail['checkInTime'].toString(), 0, 16)}"></td></tr>
                            <tr th:if="${detail['checkInIp'] != null}"><td class="text-muted">签到IP</td><td th:text="${detail['checkInIp']}"></td></tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="card summary-card mb-3">
            <div class="card-header bg-white border-0"><h2 class="h5 mb-0">开门记录</h2></div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-sm mb-0 align-middle">
                        <thead>
                            <tr><th>时间</th><th>结果</th><th>拒绝原因</th><th>指令</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="l : ${accessLogs}">
                                <td class="small text-nowrap" th:text="${#temporals.format(l.createdAt, 'MM-dd HH:mm:ss')}"></td>
                                <td>
                                    <span th:if="${l.granted == 1}" class="badge bg-success">已授权</span>
                                    <span th:if="${l.granted == 0}" class="badge bg-danger">已拒绝</span>
                                </td>
                                <td class="small text-muted" th:text="${l.denyReason}"></td>
                                <td class="small text-muted"
                                    th:text="${l.commandId != null} ? '#' + ${l.commandId} : '—'"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(accessLogs)}">
                                <td colspan="4" class="text-center text-muted py-3">暂无开门记录</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="card summary-card mb-3">
            <div class="card-header bg-white border-0"><h2 class="h5 mb-0">人工认定（写入信用流水）</h2></div>
            <div class="card-body">
                <p class="small text-muted">
                    一期没有人体感应也不做签退，「超时占用」与「违规使用」只能由管理员现场认定。
                    每项认定对同一预约只能记一次，30 日内同类问题再犯会自动加倍。
                </p>
                <form th:action="@{/reservation/penalty}" method="post" class="d-flex gap-2 flex-wrap align-items-center mb-2">
                    <input type="hidden" name="_csrf" th:value="${_csrf}" />
                    <input type="hidden" name="id" th:value="${detail['id']}" />
                    <input type="hidden" name="type" value="OVERTIME" />
                    <input type="text" name="note" class="form-control form-control-sm" style="max-width: 320px"
                           maxlength="200" placeholder="认定说明（选填）" />
                    <button type="submit" class="btn btn-sm btn-outline-warning"
                            onclick="return confirm('确认认定「超时占用」，扣 5 分？');">
                        认定超时占用（−5）
                    </button>
                </form>
                <form th:action="@{/reservation/penalty}" method="post" class="d-flex gap-2 flex-wrap align-items-center">
                    <input type="hidden" name="_csrf" th:value="${_csrf}" />
                    <input type="hidden" name="id" th:value="${detail['id']}" />
                    <input type="hidden" name="type" value="VIOLATION" />
                    <input type="text" name="note" class="form-control form-control-sm" style="max-width: 320px"
                           maxlength="200" placeholder="违规事实说明（建议填写）" />
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('确认认定「违规使用」，扣 20 分？');">
                        认定违规使用（−20）
                    </button>
                </form>
            </div>
        </div>
        <a href="/reservation/approve-list" class="btn btn-outline-secondary">返回审批列表</a>
    </section>
</main>
<th:block th:replace="~{fragments/common-scripts :: scripts}"></th:block>
</body>
</html>
