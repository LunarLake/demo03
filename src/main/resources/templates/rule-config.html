<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/common-head :: head('审核规则配置')}"></th:block>
  </head>
  <body class="d-flex">
    <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>
    <main class="content-area flex-grow-1">
      <th:block th:replace="~{fragments/header :: header('审核规则配置')}"></th:block>
      <section class="container-fluid py-4 px-3 px-md-4">
        <div
          th:if="${info != null}"
          class="alert alert-dismissible fade show"
          th:classappend="'alert-' + ${infoType != null ? infoType : 'info'}"
          role="alert"
        >
          <span th:text="${info}"></span>
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="alert alert-light border small">
          基础规则（账号有效、15 分钟对齐、容量、单元不重叠、信用分下限、违规记录）由系统内置且只读，
          这里只能调整附加规则的数值。每次保存都会生成<b>新版本</b>，
          已有预约仍按当时的版本判定，不受影响。
          <span th:if="${version != null}" class="ms-2 text-muted"
            >当前生效版本 v<span th:text="${version.versionNo}"></span>（<span
              th:text="${#temporals.format(version.effectiveFrom, 'yyyy-MM-dd HH:mm')}"
            ></span>）</span
          >
        </div>

        <div class="row g-3">
          <div class="col-12 col-lg-8">
            <div class="card summary-card">
              <div class="card-header bg-white border-0">
                <h2 class="h5 mb-0">附加规则参数</h2>
              </div>
              <div class="card-body">
                <form th:action="@{/admin/rules/publish}" method="post">
                  <input type="hidden" name="_csrf" th:value="${_csrf}" />
                  <div class="row g-3">
                    <div class="col-12 col-md-6" th:each="p : ${params}">
                      <label class="form-label" th:for="${p.key}">
                        <span th:text="${p.label}"></span>
                        <span class="text-muted small" th:text="'（' + ${p.unit} + '）'"></span>
                      </label>
                      <input
                        type="number"
                        class="form-control"
                        th:id="${p.key}"
                        th:name="${p.key}"
                        th:value="${p.currentValue}"
                        th:min="${p.min}"
                        th:max="${p.max}"
                        required
                      />
                      <div class="form-text">
                        <span th:text="${p.description}"></span>
                        <span class="text-muted" th:text="|（范围 ${p.min}–${p.max} ${p.unit}）|"></span>
                      </div>
                    </div>
                  </div>

                  <div class="mt-3">
                    <label for="note" class="form-label">变更说明</label>
                    <input
                      type="text"
                      class="form-control"
                      id="note"
                      name="note"
                      maxlength="200"
                      placeholder="例如：答辩前把人数阈值临时调到 3"
                    />
                  </div>

                  <button type="submit" class="btn btn-primary mt-3">发布新版本</button>
                </form>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-4">
            <div class="card summary-card h-100">
              <div class="card-header bg-white border-0">
                <h2 class="h5 mb-0">版本历史</h2>
              </div>
              <div class="card-body p-0">
                <ul class="list-group list-group-flush">
                  <li
                    class="list-group-item d-flex justify-content-between align-items-start"
                    th:each="h : ${history}"
                  >
                    <div>
                      <div class="fw-semibold" th:text="'v' + ${h.versionNo}"></div>
                      <div class="small text-muted" th:text="${h.note}"></div>
                    </div>
                    <span
                      class="small text-muted text-nowrap"
                      th:text="${#temporals.format(h.effectiveFrom, 'MM-dd HH:mm')}"
                    ></span>
                  </li>
                  <li
                    class="list-group-item text-muted small"
                    th:if="${#lists.isEmpty(history)}"
                  >
                    暂无版本记录
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <th:block th:replace="~{fragments/common-scripts :: scripts}"></th:block>
  </body>
</html>
