<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/common-head :: head('预约排期')}"></th:block>
    <link rel="stylesheet" th:href="@{/board.css}" />
    <meta name="_csrf" th:content="${_csrf}" />
  </head>
  <body class="d-flex">
    <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>
    <main class="content-area flex-grow-1">
      <th:block th:replace="~{fragments/header :: header('预约排期')}"></th:block>

      <section
        class="container-fluid py-3 px-2 px-md-4 board-shell"
        data-board
        th:attr="data-date=${date},data-focus-room=${focusRoomId}"
      >
        <!-- 日期切换 -->
        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
          <div class="btn-group btn-group-sm" role="group" aria-label="切换日期">
            <a class="btn btn-outline-secondary" th:href="@{/reservation/board(date=${prevDate})}">
              <i class="bi bi-chevron-left"></i>
            </a>
            <button type="button" class="btn btn-outline-secondary" id="btnToday">今天</button>
            <a class="btn btn-outline-secondary" th:href="@{/reservation/board(date=${nextDate})}">
              <i class="bi bi-chevron-right"></i>
            </a>
          </div>
          <form method="get" th:action="@{/reservation/board}" class="d-flex align-items-center gap-1">
            <input
              type="date"
              name="date"
              id="datePicker"
              class="form-control form-control-sm ui-w-150"
              th:value="${date}"
            />
            <button class="btn btn-sm btn-primary" type="submit">查看</button>
          </form>
          <span class="text-muted small ms-auto d-none d-md-inline">
            拖动框选时段，或点两次选起止；选中后可拖两端微调
          </span>
        </div>

        <!-- 图例 -->
        <div class="mb-2 d-flex flex-wrap align-items-center">
          <span class="legend-chip"><i class="legend-swatch sw-free"></i>可预约</span>
          <span class="legend-chip"><i class="legend-swatch sw-pending"></i>有人待审批</span>
          <span class="legend-chip"><i class="legend-swatch sw-occupied"></i>已占用</span>
          <span class="legend-chip"><i class="legend-swatch sw-mine"></i>我的预约</span>
          <span class="legend-chip"><i class="legend-swatch sw-mine-pending"></i>我的待审</span>
          <span class="legend-chip"><i class="legend-swatch sw-past"></i>已过去</span>
        </div>

        <!-- 排期网格 -->
        <div class="board-scroll">
          <div class="board-grid" id="boardGrid" aria-label="房间排期表"></div>
        </div>

        <div id="boardError" class="alert alert-danger mt-2 d-none" role="alert"></div>

        <!-- 约束前置提示：超容量/缺用途会挡提交，转人工只做说明 -->
        <div id="boardHint" class="board-hint d-none" role="status" aria-live="polite"></div>

        <!-- 底部操作栏 -->
        <div class="board-action mt-3">
          <div class="d-flex flex-wrap align-items-end gap-2">
            <div class="flex-grow-1 ui-minw-180">
              <div class="small text-muted">已选时段</div>
              <div id="selText">
                <span class="sel-empty">尚未选择（拖动框选，或点两次选起止）</span>
              </div>
            </div>
            <div id="selAdjust" class="d-none">
              <div class="btn-group btn-group-sm me-1" role="group" aria-label="调整开始时间">
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  data-adjust="from"
                  data-delta="-1"
                  aria-label="开始时间提前 15 分钟"
                >−</button>
                <button type="button" class="btn btn-outline-secondary" disabled id="fromLabel">--:--</button>
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  data-adjust="from"
                  data-delta="1"
                  aria-label="开始时间推后 15 分钟"
                >+</button>
              </div>
              <div class="btn-group btn-group-sm" role="group" aria-label="调整结束时间">
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  data-adjust="to"
                  data-delta="-1"
                  aria-label="结束时间提前 15 分钟"
                >−</button>
                <button type="button" class="btn btn-outline-secondary" disabled id="toLabel">--:--</button>
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  data-adjust="to"
                  data-delta="1"
                  aria-label="结束时间推后 15 分钟"
                >+</button>
              </div>
            </div>
            <div>
              <label class="form-label small mb-0" for="attendeeCount">人数</label>
              <input
                type="number"
                id="attendeeCount"
                class="form-control form-control-sm ui-w-80"
                min="1"
                max="99"
                value="2"
              />
            </div>
            <div>
              <label class="form-label small mb-0" for="purpose"
                >用途<span id="purposeReqMark" class="ui-req d-none"></span
              ></label>
              <input
                type="text"
                id="purpose"
                class="form-control form-control-sm ui-w-200"
                maxlength="200"
                placeholder="如：小组讨论"
              />
            </div>
            <button type="button" class="btn btn-primary btn-sm" id="btnSubmit" disabled>
              提交预约
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnClear" disabled>
              清空
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- 轻提示 -->
    <div
      id="toast"
      class="position-fixed start-50 translate-middle-x d-none"
      style="bottom: 90px; z-index: 1080"
    >
      <div class="alert alert-dark shadow-sm py-2 px-3 mb-0" id="toastText"></div>
    </div>

    <th:block th:replace="~{fragments/common-scripts :: scripts}"></th:block>
    <script th:src="@{/js/board.js}"></script>
  </body>
</html>
