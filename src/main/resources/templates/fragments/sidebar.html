<aside
  class="sidebar text-white d-flex flex-column"
  th:fragment="sidebar"
  xmlns:th="http://www.thymeleaf.org"
>
  <div class="d-flex align-items-center gap-2 mb-4 px-3">
    <i class="bi bi-building text-info fs-5" aria-hidden="true"></i>
    <span class="brand fw-bold brand-text">会议室预约系统</span>
  </div>

  <nav>
    <ul class="nav flex-column sidebar-menu">
      <li class="nav-item">
        <a class="nav-link" href="/">
          <i class="bi bi-speedometer2" aria-hidden="true"></i>
          <span class="menu-text">首页</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/rooms">
          <i class="bi bi-door-open" aria-hidden="true"></i>
          <span class="menu-text">会议室列表</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/reservation/board">
          <i class="bi bi-grid-3x3-gap" aria-hidden="true"></i>
          <span class="menu-text">预约排期</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/my-reservations">
          <i class="bi bi-calendar-check" aria-hidden="true"></i>
          <span class="menu-text">我的预约</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/credit">
          <i class="bi bi-star-half" aria-hidden="true"></i>
          <span class="menu-text">我的信用分</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/appeal">
          <i class="bi bi-chat-left-text" aria-hidden="true"></i>
          <span class="menu-text">我的申诉</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/profile">
          <i class="bi bi-person" aria-hidden="true"></i>
          <span class="menu-text">个人中心</span>
        </a>
      </li>
      <li class="nav-item" th:if="${session.role == 'ADMIN'}">
        <a class="nav-link" href="/reservation/approve-list">
          <i class="bi bi-clipboard-check" aria-hidden="true"></i>
          <span class="menu-text">审批管理</span>
        </a>
      </li>
      <li class="nav-item" th:if="${session.role == 'ADMIN'}">
        <a class="nav-link" href="/appeal/review">
          <i class="bi bi-shield-check" aria-hidden="true"></i>
          <span class="menu-text">申诉复核</span>
        </a>

        <a class="nav-link" href="/admin/rules">

        </a>

          <span class="menu-text">系统日志</span>
        </a>

      <li class="nav-item" th:if="${session.role == 'ADMIN'}">
        <a class="nav-link" href="/admin/dashboard">
          <i class="bi bi-pie-chart" aria-hidden="true"></i>
