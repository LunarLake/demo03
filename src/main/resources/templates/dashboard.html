<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common-head :: head('数据大屏')}"></th:block>
    <style>
        .chart-box { height: calc(100vh - 180px); }
        .chart-container { width: 100%; height: 450px; }
    </style>
</head>
<body class="d-flex">
<th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>
<main class="content-area flex-grow-1">
    <th:block th:replace="~{fragments/header :: header('数据可视化大屏')}"></th:block>
    <section class="container-fluid py-4 px-3 px-md-4 chart-box">
        <div class="row g-3">
            <div class="col-12 col-lg-6">
                <div class="card summary-card">
                    <div class="card-header bg-white border-0">
                        <h2 class="h5 mb-0">各会议室预约频次</h2>
                    </div>
                    <div class="card-body">
                        <div id="pieChart" class="chart-container"></div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-6">
                <div class="card summary-card">
                    <div class="card-header bg-white border-0">
                        <h2 class="h5 mb-0">各时段预约热度分布</h2>
                    </div>
                    <div class="card-body">
                        <div id="lineChart" class="chart-container"></div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-6">
                <div class="card summary-card">
                    <div class="card-header bg-white border-0">
                        <h2 class="h5 mb-0">签到率统计</h2>
                    </div>
                    <div class="card-body">
                        <div id="attendanceChart" class="chart-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/common-scripts :: scripts}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    var pieChart = echarts.init(document.getElementById('pieChart'));
    var lineChart = echarts.init(document.getElementById('lineChart'));

    var pieOption = {
        title: { text: '会议室预约频次', left: 'center' },
        tooltip: { trigger: 'item' },
        series: [{
            name: '预约次数', type: 'pie', radius: '60%',
            data: [],
            emphasis: { itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0, 0, 0, 0.5)' } }
        }]
    };
    pieChart.setOption(pieOption);

    var lineOption = {
        title: { text: '各时段预约热度', left: 'center' },
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: [], name: '小时' },
        yAxis: { type: 'value', name: '预约次数' },
        series: [{ name: '预约次数', data: [], type: 'line', smooth: true }]
    };
    lineChart.setOption(lineOption);

    function loadPieData() {
        axios.get('/api/report-room-usage').then(function(res) {
            var data = res.data.map(function(item) {
                return { value: item.count, name: item.label };
            });
            pieOption.series[0].data = data;
            pieChart.setOption(pieOption);
        }).catch(function(err) { console.error('Pie data error:', err); });
    }

    function loadLineData() {
        axios.get('/api/report-busy-hours').then(function(res) {
            var xData = [], sData = [];
            res.data.forEach(function(item) {
                xData.push(item.label + ':00');
                sData.push(item.count);
            });
            lineOption.xAxis.data = xData;
            lineOption.series[0].data = sData;
            lineChart.setOption(lineOption);
        }).catch(function(err) { console.error('Line data error:', err); });
    }

    var attendanceChart = echarts.init(document.getElementById('attendanceChart'));
    var attendanceOption = {
        title: { text: '签到率统计', left: 'center' },
        tooltip: { trigger: 'item' },
        series: [{
            name: '签到情况', type: 'pie', radius: '60%',
            data: [],
            emphasis: { itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0, 0, 0, 0.5)' } }
        }]
    };
    attendanceChart.setOption(attendanceOption);

    function loadAttendanceData() {
        axios.get('/api/report-attendance-rate').then(function(res) {
            var data = res.data.map(function(item) {
                return { value: item.count, name: item.label };
            });
            attendanceOption.series[0].data = data;
            attendanceChart.setOption(attendanceOption);
        }).catch(function(err) { console.error('Attendance data error:', err); });
    }

    loadPieData();
    loadLineData();
    loadAttendanceData();

    window.onresize = function() {
        pieChart.resize();
        lineChart.resize();
        attendanceChart.resize();
    };
</script>
</body>
</html>
