<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block
      th:replace="~{fragments/common-head :: head('会议签到')}"
    ></th:block>
  </head>
  <body class="d-flex">
    <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>
    <main class="content-area flex-grow-1">
      <th:block
        th:replace="~{fragments/header :: header('会议签到')}"
      ></th:block>
      <section class="container-fluid py-4 px-3 px-md-4">
        <div class="row justify-content-center">
          <div class="col-md-6 col-lg-4">
            <div class="card summary-card">
              <div class="card-body text-center py-4">
                <i
                  class="bi bi-qr-code-scan text-primary"
                  style="font-size: 3rem"
                ></i>
                <h3 class="mt-3">签到验证</h3>
                <p class="text-muted" th:if="${codeVisibleOnWeb}">请输入 4 位签到码（未接门禁时可在此页面附近查看）</p>
                <p class="text-muted" th:unless="${codeVisibleOnWeb}">请输入门禁屏幕上显示的 4 位签到码</p>
                <p class="text-muted small">签到在<b>预约开始时刻</b>开放，<b>开始后 <span th:text="${checkinWindowMinutes}">5</span> 分钟</b>截止（短预约以结束时刻为上限）；逾期未签到将自动释放并记爽约。</p>
                <p
                  th:if="${info != null}"
                  class="fw-bold"
                  th:classappend="${infoType == 'success'} ? 'text-success' : 'text-danger'"
                  th:text="${info}"
                ></p>
                <form
                  th:if="${checkInFinished != true}"
                  th:action="@{/reservation/check-in-action}"
                  method="post"
                  class="mt-3"
                >
                  <input type="hidden" name="_csrf" th:value="${_csrf}" />
                  <input
                    type="hidden"
                    name="reservationId"
                    th:value="${reservationId}"
                  />
                  <div class="mb-3">
                    <input
                      type="text"
                      class="form-control form-control-lg text-center"
                      id="code"
                      name="code"
                      placeholder="请输入4位签到码"
                      maxlength="4"
                      pattern="[0-9]{4}"
                      required
                      style="letter-spacing: 1rem; font-size: 1.5rem"
                    />
                  </div>
                  <button type="submit" class="btn btn-primary btn-lg w-100">
                    确认签到
                  </button>
                </form>
                <a
                  href="/my-reservations"
                  class="btn btn-outline-secondary mt-3"
                  >返回我的预约</a
                >
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <th:block th:replace="~{fragments/common-scripts :: scripts}"></th:block>
  </body>
</html>
