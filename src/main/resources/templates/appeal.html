<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/common-head :: head('我的申诉')}"></th:block>
  </head>
  <body class="d-flex">
    <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>
    <main class="content-area flex-grow-1">
      <th:block th:replace="~{fragments/header :: header('我的申诉')}"></th:block>
      <section class="container-fluid py-4 px-3 px-md-4">
        <div
          th:if="${info != null}"
          class="alert alert-dismissible fade show"
          th:classappend="'alert-' + ${infoType != null ? infoType : 'info'}"
          role="alert"
        >
          <span th:text="${info}"></span>
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="alert alert-light border small">
          <b>申诉能做什么：</b>纠正扣分、更正记录、或推翻拒绝/取消的结论。<br />
          <b>申诉不能做什么：</b>不会把已经释放的时段"变回来"——房间可能已被别人订走。
          如果仍需要房间，请在申诉后重新提交一笔预约。
        </div>

        <div class="card summary-card">
          <div class="card-header bg-white border-0">
            <h2 class="h5 mb-0">我的工单</h2>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-sm table-hover mb-0 align-middle">
                <thead>
                  <tr>
                    <th>提交时间</th>
                    <th>对象</th>
                    <th>申诉说明</th>
                    <th>状态</th>
                    <th>应办结</th>
                    <th>复核意见</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="a : ${appeals}">
                    <td
                      class="small text-nowrap"
                      th:text="${#temporals.format(a['created_at'], 'MM-dd HH:mm')}"
                    ></td>
                    <td class="small">
                      <span th:text="${a['target_type'] == 'CREDIT'} ? '信用扣分' : '预约'"></span>
                      <span class="text-muted" th:text="'#' + ${a['target_id']}"></span>
                      <div
                        class="text-muted"
                        th:if="${a['roomName'] != null}"
                        th:text="${a['roomName']}"
                      ></div>
                    </td>
                    <td class="small" th:text="${a['reason']}"></td>
                    <td>
                      <span
                        th:if="${a['status'] == 'SUBMITTED'}"
                        class="badge bg-warning"
                        >待复核</span
                      >
                      <span th:if="${a['status'] == 'UPHELD'}" class="badge bg-secondary"
                        >维持原判</span
                      >
                      <span th:if="${a['status'] == 'REVOKED'}" class="badge bg-success"
                        >申诉成立</span
                      >
                      <span th:if="${a['status'] == 'PARTIAL'}" class="badge bg-info"
                        >部分成立</span
                      >
                    </td>
                    <td
                      class="small text-nowrap"
                      th:text="${#temporals.format(a['due_at'], 'MM-dd HH:mm')}"
                    ></td>
                    <td class="small text-muted" th:text="${a['review_note']}"></td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(appeals)}">
                    <td colspan="6" class="text-center text-muted py-4">
                      还没有申诉记录。在「我的预约」或「信用分」页面可以对具体结果发起申诉。
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="mt-3 d-flex gap-2">
          <a th:href="@{/my-reservations}" class="btn btn-outline-secondary btn-sm">返回我的预约</a>
          <a th:href="@{/credit}" class="btn btn-outline-secondary btn-sm">查看信用分</a>
        </div>
      </section>
    </main>
    <th:block th:replace="~{fragments/common-scripts :: scripts}"></th:block>
  </body>
</html>
